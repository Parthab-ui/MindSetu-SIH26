name: Optimize MindSetu AI speed

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  optimize:
    if: ${{ !startsWith(github.event.head_commit.message, 'Optimize MindSetu AI streaming') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch AI streaming
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('backend/main.py')
          s = p.read_text()
          s = s.replace('"stream": False,', '"stream": True,', 1)
          s = re.sub(r'\n        "format": \{.*?\n        \},\n', '\n', s, count=1, flags=re.S)
          start = s.index('def stream_ollama_response(payload):')
          end = s.index('\n\n# =========================================================\n# CHAT', start)
          fn = '''def stream_ollama_response(payload):

    try:
        with requests.post(OLLAMA_URL, json=payload, stream=True, timeout=(5, OLLAMA_TIMEOUT)) as response:
            if response.status_code != 200:
                try:
                    detail = response.json().get("error") or "Ollama returned an error."
                except Exception:
                    detail = "Ollama returned an HTTP error."
                yield json.dumps({"type": "error", "message": detail}) + "\\n"
                return
            sent = False
            for raw_line in response.iter_lines(decode_unicode=True):
                if not raw_line:
                    continue
                try:
                    data = json.loads(raw_line)
                except (TypeError, json.JSONDecodeError):
                    continue
                content = (data.get("message") or {}).get("content") or ""
                if content:
                    sent = True
                    yield json.dumps({"type": "token", "content": content}) + "\\n"
                if data.get("done"):
                    break
            if not sent:
                yield json.dumps({"type": "error", "message": "AI returned an empty response."}) + "\\n"
                return
            yield json.dumps({"type": "done"}) + "\\n"
    except requests.exceptions.ConnectionError:
        yield json.dumps({"type": "error", "message": "MindSetu cannot connect to Ollama. Make sure Ollama is running."}) + "\\n"
    except requests.exceptions.Timeout:
        yield json.dumps({"type": "error", "message": "Qwen took too long to respond."}) + "\\n"
    except requests.exceptions.RequestException as error:
        print("OLLAMA ERROR:", error)
        yield json.dumps({"type": "error", "message": "The AI service is temporarily unavailable."}) + "\\n"
    except Exception as error:
        print("OLLAMA UNEXPECTED ERROR:", error)
        yield json.dumps({"type": "error", "message": str(error)}) + "\\n"
'''
          s = s[:start] + fn + s[end:]
          p.write_text(s)

          p = Path('frontend/src/App.jsx')
          s = p.read_text()
          marker = '    // Small delay between displayed characters.'
          if marker in s:
              start = s.index(marker)
              end = s.index('\n    try {', start)
              replacement = '''    function appendStreamText(textToAppend) {
      if (!textToAppend) return;
      setChatMessages((previous) => previous.map((chatMessage, index) => {
        if (index === previous.length - 1 && chatMessage.sender === "ai" && chatMessage.streaming) {
          return { ...chatMessage, text: chatMessage.text + textToAppend };
        }
        return chatMessage;
      }));
    }
'''
              s = s[:start] + replacement + s[end:]
          s = s.replace('await appendStreamText(\n              token\n            );', 'appendStreamText(token);')
          s = s.replace('await appendStreamText(\n              chunk.content\n            );', 'appendStreamText(chunk.content);')
          p.write_text(s)
          PY
      - name: Validate backend
        run: python -m py_compile backend/main.py
      - name: Validate frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Commit optimization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/main.py frontend/src/App.jsx
          git diff --cached --quiet && exit 0
          git commit -m 'Optimize MindSetu AI streaming'
          git push
