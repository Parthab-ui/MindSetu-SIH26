name: MindSetu AI Self Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ai-self-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run AI regression audit
        run: pytest -q tests/test_ai_self_audit.py
