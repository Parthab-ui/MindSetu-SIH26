services:
  postgres:
    image: postgres:16-alpine
    container_name: mindsetu-dev-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mindsetu_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment or .env}
    volumes:
      - mindsetu_dev_postgres_data:/var/lib/postgresql/data
      - ./backend/dev_init.sql:/docker-entrypoint-initdb.d/001_dev_init.sql:ro
    ports:
      - "5432:5432"
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: mindsetu-dev-ollama
    volumes:
      - mindsetu_dev_ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

volumes:
  mindsetu_dev_postgres_data:
  mindsetu_dev_ollama_data:
